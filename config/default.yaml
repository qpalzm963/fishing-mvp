# All geometry is expressed as ratios or relationships to detected UI anchors.
# These values tune detector confidence; they are not click coordinates.
capture_fps: 10

scrcpy:
  # 0 keeps the device stream at its native resolution for safe coordinates.
  max_size: 0
  max_fps: 30
  video_bit_rate: 8000000
  connect_timeout_s: 10.0
  frame_timeout_s: 3.0

detector:
  # Downsampled processing keeps QTE cursor tracking responsive; coordinates
  # are restored to the original framebuffer before any ADB input.
  max_work_width: 480
  button_min_radius_ratio: 0.045
  button_max_radius_ratio: 0.22
  button_min_y_ratio: 0.57
  button_max_y_ratio: 0.91
  button_active_purple_ratio: 0.08
  prompt_min_fill_ratio: 0.10
  prompt_min_aspect: 2.0
  prompt_max_aspect: 12.0
  gauge_min_aspect: 2.4
  gauge_min_width_button_radius: 2.2
  gauge_min_color_pixels: 80
  gauge_min_state_score: 0.72
  quality_min_pixels: 180
  result_dark_luma: 112
  result_yellow_ratio: 0.010
  motion_threshold: 22
  motion_min_ratio: 0.04

state_machine:
  stable_frames: 2
  unknown_grace_frames: 8
  result_min_hold_s: 2.0

action:
  # Zero uses Android input tap; a positive value uses a slower same-point swipe.
  tap_hold_ms: 0
  auto_start: false
  qte_enabled: false
  auto_continue: false
  min_confidence: 0.68
  min_action_interval_s: 0.45
  qte_min_interval_s: 0.18
  qte_target_margin: 0.05
  # Predict marker position over the observed frame-to-input latency.
  qte_input_latency_s: 0.18
  qte_velocity_samples: 3
  qte_min_velocity_norm_s: 0.12

automation:
  # Full-auto stops instead of waiting forever when a stage is not recognised.
  unknown_timeout_s: 8.0
  waiting_timeout_s: 30.0
  # A round that returned to waiting without RESULT is not allowed to restart.
  unconfirmed_waiting_timeout_s: 8.0
  prompt_timeout_s: 12.0
  casting_timeout_s: 12.0
  qte_timeout_s: 35.0
  quality_timeout_s: 10.0
  result_timeout_s: 12.0
  # Keep the foreground safety check without blocking every QTE tap.
  foreground_check_interval_s: 0.75
