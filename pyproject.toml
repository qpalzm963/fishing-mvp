[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fishing-mvp"
version = "0.1.0"
description = "Dynamic OpenCV UI detection and safe ADB control MVP for a fishing game"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
scrcpy = ["av>=12.0"]
windows = ["pyinstaller==6.13.0"]

[project.scripts]
fishing-mvp = "fishing_mvp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fishing_mvp = ["defaults/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
