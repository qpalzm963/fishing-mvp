# Packaged baseline. Keep this synchronized with config/default.yaml.
capture_fps: 10
qte_capture_fps: 30

scrcpy:
  max_size: 0
  max_fps: 30
  video_bit_rate: 8000000
  connect_timeout_s: 10.0
  frame_timeout_s: 3.0

detector:
  max_work_width: 480
  button_min_radius_ratio: 0.045
  button_max_radius_ratio: 0.22
  button_min_y_ratio: 0.57
  button_max_y_ratio: 0.91
  button_active_purple_ratio: 0.08
  prompt_min_fill_ratio: 0.10
  prompt_min_aspect: 2.0
  prompt_max_aspect: 12.0
  gauge_min_aspect: 2.4
  gauge_min_width_button_radius: 2.2
  gauge_min_color_pixels: 80
  gauge_target_min_color_pixels: 24
  gauge_target_min_width_ratio: 0.025
  gauge_target_min_width_px: 6
  gauge_target_min_column_coverage: 0.45
  gauge_marker_max_width_ratio: 0.35
  gauge_full_res_refine_enabled: true
  gauge_full_res_refine_padding_ratio: 0.12
  gauge_target_tracking_frames: 4
  gauge_target_tracking_max_width_ratio: 0.18
  gauge_target_tracking_max_gap_ratio: 0.06
  gauge_target_tracking_missing_frames: 4
  gauge_min_state_score: 0.72
  quality_min_pixels: 180
  result_dark_luma: 112
  result_yellow_ratio: 0.010
  motion_threshold: 22
  motion_min_ratio: 0.04

state_machine:
  stable_frames: 2
  unknown_grace_frames: 8
  result_min_hold_s: 2.0

action:
  tap_hold_ms: 0
  auto_start: false
  qte_enabled: false
  auto_continue: false
  min_confidence: 0.68
  min_action_interval_s: 0.45
  qte_min_interval_s: 0.18
  qte_target_margin: 0.05
  qte_eta_enabled: true
  qte_boundary_mode: auto
  qte_input_latency_s: 0.18
  qte_latency_sample_window: 5
  qte_velocity_samples: 3
  qte_min_velocity_norm_s: 0.12
  qte_velocity_max_jitter_norm_s: 0.8
  qte_prediction_grace_s: 0.24
  # Re-detect result controls after each tap while the overlay remains.
  result_extra_tap_enabled: true
  result_extra_tap_delay_s: 1.0
  result_max_attempts: 3

automation:
  unknown_timeout_s: 8.0
  waiting_timeout_s: 30.0
  unconfirmed_waiting_timeout_s: 8.0
  prompt_timeout_s: 12.0
  casting_timeout_s: 12.0
  qte_timeout_s: 35.0
  quality_timeout_s: 10.0
  result_timeout_s: 12.0
  foreground_check_interval_s: 0.75
