name: Android APK

on:
  push:
    paths:
      - "android/**"
      - "src/**"
      - "tests/fixtures/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - "tests/fixtures/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.10 (Chaquopy build Python)
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy `tools` package was removed from sdkmanager; requesting it
          # fails the job before Gradle runs.
          packages: platform-tools emulator

      - name: Build debug APK
        env:
          CHAQUOPY_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fishing-mvp-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
